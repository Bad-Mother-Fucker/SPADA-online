# spada-limits.conf — tetto alla dimensione del journal di systemd.
#
# Senza questo, un servizio in crash-loop (osservato: 47.000+ riavvii di
# spada-api in un episodio reale, causato dal bug SSE corretto in
# routers/gare.py::stream_stato) può riempire il disco di log prima che
# chiunque se ne accorga — e su un e2-micro con un boot disk piccolo,
# "il disco pieno" è di per sé sufficiente a far collassare anche
# systemd-journald stesso (osservato nello stesso episodio: watchdog
# timeout ripetuti su journald, servizio ucciso e rilanciato per oltre
# 20 minuti).
#
# Installazione (una tantum, manuale — vedi infra/DEPLOY.md):
#   sudo cp infra/systemd/journald.conf.d/spada-limits.conf \
#     /etc/systemd/journald.conf.d/spada-limits.conf
#   sudo systemctl restart systemd-journald

[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
