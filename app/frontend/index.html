<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPADA Online — Gare</title>
<meta name="description" content="Elenco delle gare in lavorazione: stato della pipeline a 7 fasi, checkpoint da rivedere ed errori.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<!-- ui.js in <head>: decide il tema prima del primo paint, così la pagina
     non compare mai nel tema sbagliato. -->
<script src="js/ui.js"></script>
</head>
<body data-accent="bronzo" data-glass="medio">

<a class="skip" href="#contenuto">Salta all'elenco delle gare</a>
<div class="bg-glow" aria-hidden="true" data-parallax="true"></div>

<div class="appbar">
  <div class="appbar__inner appbar__inner--narrow">
    <a class="brand" href="index.html">
      <span class="brand__mark" id="brand-mark"></span>
      <span class="brand__name">SPADA</span>
    </a>
    <span style="font-size:var(--fs-xs);color:var(--ink-3)">Gare</span>
    <div class="spacer"></div>
    <div class="row row--tight" style="flex-wrap:nowrap">
      <span class="badge" id="stato-backend" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>Connessione…
      </span>
      <span id="slot-tema"></span>
      <span class="avatar" title="Operatore">GC</span>
    </div>
  </div>
</div>

<main class="shell shell--list" id="contenuto">

  <header class="pagehead">
    <div>
      <h1>Gare in lavorazione</h1>
      <p id="sommario-gare">Caricamento dell'elenco…</p>
    </div>
    <button type="button" class="btn btn--primary" id="apri-nuova-gara"></button>
  </header>

  <div class="filterbar">
    <div class="filterbar__group" role="group" aria-label="Filtra per stato" id="filtri"></div>
    <label class="search">
      <span class="sr-only">Cerca fra le gare</span>
      <input type="search" class="input input--sm" id="ricerca" placeholder="Cerca per nome o slug" autocomplete="off">
    </label>
  </div>

  <div id="elenco" aria-live="polite"></div>

  <p style="margin:var(--s-5) 0 0;font-size:var(--fs-micro);color:var(--ink-4)">
    Ordinamento predefinito: prima le gare che richiedono un'azione umana, poi per ultimo aggiornamento.
  </p>
</main>

<!-- Nuova gara: overlay di vetro sull'elenco, che resta riconoscibile dietro
     al blur. Costruito da elenco.js all'apertura, non allo start. -->
<div class="overlay" id="overlay-nuova-gara" hidden></div>

<script src="js/dominio.js"></script>
<script src="js/api.js"></script>
<script src="js/elenco.js"></script>
</body>
</html>
