<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPADA Online — Impostazioni</title>
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script>
  document.write('<link rel="stylesheet" href="' + window.SPADA_API_BASE + '/sistema/design-system.css">');
</script>
</head>
<body>
<div class="wrap">
  <a href="javascript:history.back()" class="sub">← Torna alla gara</a>
  <h1>Impostazioni</h1>

  <h2>Gara</h2>
  <div class="output-block" id="i-gara">Caricamento…</div>

  <h2>Sistema</h2>
  <div class="output-block" id="i-sistema">Caricamento…</div>

  <h2>Prezzari disponibili</h2>
  <div class="output-block" id="i-prezzari">Caricamento…</div>

  <h2>Storico esecuzioni</h2>
  <table class="storico" id="i-runlog"><tbody></tbody></table>

  <details class="log-grezzo">
    <summary>Stato grezzo della gara (JSON)</summary>
    <pre id="i-json-grezzo"></pre>
  </details>
</div>
<script src="js/api.js"></script>
<script src="js/impostazioni.js"></script>
</body>
</html>
