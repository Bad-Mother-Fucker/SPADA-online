<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPADA Online — Gara</title>
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script>
  document.write('<link rel="stylesheet" href="' + window.SPADA_API_BASE + '/sistema/design-system.css">');
</script>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="sub">← Tutte le gare</a>

  <header class="gara-top">
    <div>
      <h1 id="g-nome">—</h1>
      <div class="gara-meta" id="g-meta">—</div>
    </div>
  </header>

  <p class="sintesi-corrente" id="g-sintesi">—</p>

  <div class="barra-fasi" id="g-barra"></div>

  <section id="g-upload" class="doc-upload">
    <h2>Documenti</h2>
    <form id="form-upload">
      <div class="campo">
        <label for="u-categoria">Categoria</label>
        <select id="u-categoria" name="categoria">
          <option value="disciplinare">Disciplinare</option>
          <option value="elaborati">Elaborati</option>
          <option value="p7m">P7M</option>
        </select>
      </div>
      <div class="campo">
        <label for="u-file">File</label>
        <input id="u-file" name="file" type="file" required>
      </div>
      <button type="submit">Carica</button>
    </form>
    <p id="upload-esito" class="esito" hidden></p>
  </section>

  <h2>Fasi</h2>
  <div class="fasi-lista" id="g-fasi"></div>

  <section id="g-revisione" class="approval-panel" hidden>
    <h2>Revisione proposte (Fase 5)</h2>
    <p class="sub">Una proposta per riga, non un blocco unico: approva, chiedi modifiche o scarta con nota.</p>
    <div id="g-proposte"></div>
  </section>

  <div class="vista-agenti">
    <h3 id="g-agenti-titolo">Agenti al lavoro</h3>
    <div id="g-agenti"></div>
  </div>

  <h2>Elaborati prodotti</h2>
  <div class="output-lista" id="g-output">Caricamento…</div>

  <h2>Storico esecuzioni</h2>
  <table class="storico" id="g-runlog"><tbody></tbody></table>

  <details class="log-grezzo">
    <summary>Log grezzo (JSON)</summary>
    <pre id="g-json-grezzo"></pre>
  </details>
</div>
<script src="js/api.js"></script>
<script src="js/gara.js"></script>
</body>
</html>
