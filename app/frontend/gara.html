<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPADA Online — Gara</title>
<meta name="description" content="Pagina gara: stepper delle 7 fasi, viste di fase, grafo di tracciabilità, attività e assistente in sola lettura.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
</head>
<body data-accent="bronzo" data-glass="medio">

<a class="skip" href="#vista">Salta al contenuto della fase</a>
<div class="bg-glow" aria-hidden="true" data-parallax="true"></div>

<!-- ===================== GUSCIO · barra applicativa ======================
     Persistente: non si ricarica al cambio di fase o di vista trasversale. -->
<div class="appbar">
  <div class="appbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" id="brand-mark"></span>
      <span class="brand__name">SPADA</span>
    </a>
    <nav class="crumbs" aria-label="Percorso">
      <a href="index.html">Gare</a>
      <span class="crumbs__sep" aria-hidden="true">/</span>
      <span class="crumbs__slug" id="crumb-slug"></span>
      <span class="crumbs__sep" aria-hidden="true">/</span>
      <span class="crumbs__leaf" id="crumb-vista"></span>
    </nav>
    <div class="spacer"></div>

    <!-- Viste trasversali: sostituiscono l'area centrale, non sono overlay. -->
    <div class="seg seg--boxed" role="group" aria-label="Viste trasversali" id="viste-trasversali"></div>

    <div class="row row--tight" style="flex-wrap:nowrap">
      <span class="badge" id="stato-sse" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>SSE
      </span>
      <span id="slot-tema"></span>
      <span class="avatar" title="Operatore">GC</span>
    </div>
  </div>
</div>

<div class="shell">

  <!-- Assistente: pannello flottante, colonna del guscio e non overlay.
       Contesto sempre l'intera gara, attivo dalla Fase 2. -->
  <aside class="assistant" id="assistente" aria-label="Assistente di gara" hidden></aside>
  <button type="button" class="fab" id="fab-assistente" aria-expanded="false" aria-controls="assistente"></button>

  <main>
    <!-- ==================== GUSCIO · intestazione gara ==================== -->
    <header class="card card--xl tenderhead" id="testata-gara"></header>

    <!-- ====================== GUSCIO · stepper 7 fasi ===================== -->
    <nav class="stepper" aria-label="Fasi della pipeline">
      <ol id="stepper"></ol>
    </nav>

    <!-- ======================== CONTENUTO CENTRALE ======================== -->
    <div id="vista">
      <div class="viewhead" id="testata-vista"></div>
      <div class="viewport" id="viewport" aria-live="polite"></div>
    </div>
  </main>
</div>

<script src="js/dominio.js"></script>
<script src="js/md.js"></script>
<script src="js/api.js"></script>
<!-- viste.js prima di gara.js: definisce i renderer che il guscio invoca. -->
<script src="js/viste.js"></script>
<script src="js/gara.js"></script>
</body>
</html>
