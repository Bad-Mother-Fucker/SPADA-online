<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Prometheus - S.P.A.D.A.: icona del prodotto. Spada bianca in diagonale
       su accento cobalto (DESIGN.md, colore primary). Sorgente unica di favicon,
       icone dell'app e lanciatori Windows: dev/icone.mjs ne ricava le altre. -->
