  <g transform="translate(32 32) scale(0.9) rotate(45) translate(-32 -32.6)">
    <!-- lama -->
    <path d="M32 3 L36.5 9.5 V40 H27.5 V9.5 Z" fill="#FFFFFF"/>
    <!-- sguscio -->
    <path d="M32 11 V37" stroke="#9DB2E8" stroke-width="1.6" stroke-linecap="round"/>
    <!-- elsa -->
    <rect x="18" y="40" width="28" height="5" rx="2.5" fill="#FFFFFF"/>
    <!-- impugnatura -->
    <rect x="29.3" y="45" width="5.4" height="10.5" rx="1.2" fill="#DCE4F7"/>
    <!-- pomolo -->
    <circle cx="32" cy="58.5" r="3.8" fill="#FFFFFF"/>
