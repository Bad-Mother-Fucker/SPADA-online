<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Prometheus - S.P.A.D.A.</title>
    <meta name="description" content="Elenco delle gare in lavorazione: stato della pipeline a 7 fasi, checkpoint da rivedere ed errori." />
    <script>
      // Il tema va deciso prima del primo paint, così la pagina non compare
      // mai nel tema sbagliato. Stessa chiave del frontend precedente.
      try {
        var t = new URLSearchParams(location.search).get("tema") || localStorage.getItem("spada.tema");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
