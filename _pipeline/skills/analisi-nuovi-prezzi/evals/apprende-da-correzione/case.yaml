name: apprende-da-correzione
description: >
  Stadio definitivo con analisi corretta a mano dal professionista: la
  skill deve confrontare generato e approvato, trasformare le differenze
  in lezioni generalizzate con il perché preso dalla nota, registrare il
  prezzo corretto e archiviare l'analisi approvata — senza imparare nulla
  dal proprio output non toccato.
